  'por siempre tucu':

  'nacho cuéllar':

  'néstor garnica':

  'los de imaguaré':
    'Histórico conjunto de chamamé nacido artísticamente el 5 de julio de 1977 en Mercedes, Corrientes, bajo la dirección de Joaquín Sheridan y Julio Cáceres. Con más de cuatro décadas de trayectoria, una extensa discografía y una fuerte impronta poética, es una de las formaciones fundamentales de la música del litoral.',
  'los tabaleros':
    'Banda argentina que fusiona folklore tradicional con rock, punk y otros géneros contemporáneos. Su propuesta combina instrumentos y ritmos folklóricos con una puesta en escena festiva, irreverente y de gran energía.',
  'wara calpanchay':
    'Cantora e intérprete vinculada a las expresiones musicales de raíz andina y al folklore del norte argentino. Su participación en espacios de encuentro folklórico pone en valor las tradiciones musicales regionales.',
  'yoel hernández':
    'Cantor y compositor patagónico, nacido en Chubut. Su repertorio recupera historias, paisajes y personajes de la Patagonia, con una propuesta que combina música folklórica y canción popular.',
  'tomás lipán':
    'Tomás Ríos, conocido artísticamente como Tomás Lipán, nació en Purmamarca, Jujuy. Cantor de origen aimara, es uno de los grandes referentes del folklore del norte argentino. Integró el grupo de Jaime Torres durante buena parte de los años noventa y desarrolló luego una importante carrera solista, difundiendo los ritmos y la cultura de la Quebrada de Humahuaca.',
  'los bofill':
    'Familia y conjunto musical argentino vinculado a la tradición folklórica del norte del país. Su propuesta se apoya en las raíces populares, el canto colectivo y el repertorio tradicional.',
  'jesús toledo':
    'Cantor argentino vinculado a la música folklórica y a los escenarios populares del país. Su repertorio se inscribe en la tradición del folklore nacional.',
  'tupá':

  'sele vera':
    'Cantora argentina de folklore, reconocida por su interpretación de música popular y tradicional. Se hizo conocida por su difusión en redes sociales y plataformas digitales, donde sus interpretaciones alcanzaron una importante audiencia.',
  'orellanalucca':
    'Dúo santiagueño integrado por Manuel Orellana y Rodolfo Lucca. Con más de 25 años de trayectoria, son referentes de una nueva generación del folklore de Santiago del Estero. Obtuvieron la Consagración de Cosquín 2016 y Jesús María 2017 y cuentan con una discografía que combina la chacarera tradicional con una mirada renovadora.',
  'paquito ocaño':
    'Cantor argentino de folklore, vinculado a la música popular del norte y a los circuitos de festivales y peñas folklóricas.',
  'peteco carabajal':
    'Pedro “Peteco” Carabajal es músico, compositor, violinista y cantor santiagueño, integrante de una de las familias fundamentales de la historia del folklore argentino. Su obra renovó la chacarera y combina la tradición musical de Santiago del Estero con nuevas búsquedas artísticas. En este espectáculo se presenta con Riendas Libres.',
  'riendas libres':
    'Proyecto musical liderado por Peteco Carabajal que reúne músicos de distintas generaciones en una propuesta de folklore contemporáneo. Combina chacareras, canciones populares y nuevas sonoridades, manteniendo como base la tradición santiagueña.',
  'ahyre':
    'Grupo folklórico salteño formado en 2019 por Juan José Vasconcellos, Sebastián Giménez, Hernando Mónico y Federico Maldonado, con Guido Bertini en batería y percusión. Fusiona la raíz folklórica latinoamericana con sonidos contemporáneos. Ganó el Premio Gardel 2020 a Mejor Álbum Grupo de Folklore y obtuvo dos Gaviotas de Plata en Viña del Mar 2024.',
  'carafea':
    'Agrupación argentina de música folklórica que forma parte de la nueva generación de propuestas del género. Su repertorio y presentaciones se vinculan con la música popular de raíz y el circuito de festivales nacionales.',
  'lázaro caballero':
    'Cantor y compositor nacido en Formosa, referente del folklore del norte argentino. Su música combina chacareras, zambas y ritmos tradicionales con una fuerte identidad regional. Se ha convertido en una figura habitual de los principales festivales folklóricos del país.',
  'diableros jujeños':
    'Conjunto jujeño surgido en 2009 como Dúo Diablero y que adoptó el nombre Diableros Jujeños en 2010. Su música está profundamente vinculada al carnaval, la Pachamama y las tradiciones del altiplano. Integra instrumentos autóctonos y ritmos como el carnavalito, tinku y saya.',
  'campedrinos':
    'Dúo folklórico argentino integrado por Sergio Prada y Agustín Fantili. Surgió de la unión de dos jóvenes músicos de distintas localidades bonaerenses y se caracteriza por acercar el folklore tradicional a nuevos públicos mediante una propuesta fresca y contemporánea.',
  'gauchos of the pampa':
    'Proyecto musical argentino que recupera la tradición gauchesca y los sonidos de la música folklórica de la llanura pampeana, con una propuesta vinculada a la identidad criolla.',
  'maggie cullen':
    'Magdalena Cullen es una cantante argentina de folklore y canción popular latinoamericana. Comenzó a tocar la guitarra a los seis años y se acercó especialmente al folklore durante su adolescencia. En 2023 debutó en el escenario mayor de Cosquín y ganó el Premio Gardel a Mejor Canción de Folklore por su interpretación de “Canto versos”, de Jorge Fandermole. Su álbum Canciones del viento consolidó su proyección artística.',
  'indio lucio rojas':
    'Lucio Rojas, conocido como El Indio Lucio Rojas, es un cantor y compositor argentino de folklore, hermano de Jorge Rojas. Integró Los Carabajal y posteriormente el proyecto Los Rojas junto a su hermano. En 2016 inició su carrera solista con el álbum Yo soy el Indio, desarrollando un repertorio profundamente ligado a la música del monte y la chacarera.',
  'la bruja salguero':
    'María de los Ángeles Salguero, conocida como La Bruja Salguero, nació en La Rioja el 2 de agosto de 1972. Debutó profesionalmente a los doce años en el Festival Nacional de la Chaya. Es una de las voces más destacadas del folklore argentino contemporáneo. Recibió el Premio Konex de Platino y el Premio Gardel, entre otros reconocimientos.',
  'los berbel':
    'Familia y conjunto folklórico de la provincia de Neuquén, referentes de la música popular patagónica. Su repertorio recupera las canciones, paisajes e historias del sur argentino y la identidad cultural de la Patagonia.',
  'dos más uno':
    'Trío argentino de música popular integrado por Marcelo Dellamea, Hugo Dellamea y Ariel Sánchez. Formado en 2012, desarrolla una propuesta que combina folklore, música latinoamericana y arreglos vocales e instrumentales propios. Ganó el Premio Konex 2025 en el rubro Folklore y fue nominado a los Premios Gardel.',
  'sergio galleguillo':
    'Cantor y compositor riojano, uno de los grandes referentes de la chaya y el folklore del noroeste argentino. Su propuesta combina música tradicional, ritmos festivos y una fuerte identidad cultural riojana. Es conocido por sus celebraciones populares y su presencia en los principales festivales del país.',
  'mariana carrizo':
    'Cantora y coplera salteña, nacida en los Valles Calchaquíes. Es una de las principales exponentes de la copla del noroeste argentino y se destaca por preservar y difundir el canto ancestral, acompañado por caja, y las tradiciones musicales de los pueblos andinos.',
  'dj rama cuti':
    'DJ y musicalizador que participa de la apertura de las jornadas del festival con una selección musical previa a los espectáculos en vivo.',
  'nicolás membriani - paquito ocaño':
    'Presentación compartida de Nicolás Membriani, reconocido payador bonaerense nacido en Rojas y payador oficial del Festival de Jesús María, junto al cantor folklórico Paquito Ocaño.',
  'payadores gaboto-tokar':
    'Emanuel Gabotto y Tokar, payadores vinculados a la tradición de la improvisación gauchesca. La payada es una expresión de la cultura criolla en la que los intérpretes improvisan versos acompañados por guitarra, poniendo en juego ingenio, memoria y destreza poética.',
  'payadores gaboto-tokar / wara calpanchay':
    'Encuentro de payada e interpretación folklórica con los payadores Gaboto-Tokar y la cantora Wara Calpanchay, en un espacio dedicado a la música y las tradiciones populares.',
  'payadores gaboto-tokar / yoel hernández':
    'Presentación compartida de los payadores Gaboto-Tokar y el cantor patagónico Yoel Hernández, que reúne la improvisación gauchesca con la canción folklórica del sur argentino.',
  'cuti carabajal':
    'Cuti Carabajal es un cantor y compositor santiagueño, integrante de la reconocida familia Carabajal. Su trayectoria está ligada a la difusión de la chacarera y de la música folklórica de Santiago del Estero.',
  'roberto carabajal':'Roberto Carabajal es un músico y cantor santiagueño perteneciente a la histórica familia Carabajal. Su carrera está vinculada a la interpretación y difusión de la chacarera y el folklore tradicional.',

var SOC=[['web','Sitio web','--acc',function(v){return v}],
['ig','Instagram','#d62976',function(v){return 'https://www.instagram.com/'+v}],
['fb','Facebook','#1877f2',function(v){return 'https://www.facebook.com/'+v}],
['wiki','Wikipedia','--ink',function(v){return 'https://es.wikipedia.org/wiki/'+v}],
['sp','Spotify','#1db954',function(v){return 'https://open.spotify.com/'+v}]];
function socFor(n){var l=L[key(n)];if(!l)return '';return '<div class="soc">'+SOC.filter(function(c){return l[c[0]]}).map(function(c){var v=l[c[0]],u=/^https?:/.test(v)?v:c[3](v),col=c[2].charAt(0)==='-'?'var('+c[2]+')':c[2];return '<a target="_blank" rel="noopener" aria-label="'+c[1]+'" title="'+c[1]+'" style="--c:'+col+'" href="'+esc(u)+'">'+SVG[c[0]]+'</a>'}).join('')+'</div>'}
/* ALIAS: nombre del show (minúscula) → clave de B/L. Sirve cuando el título del show no es el nombre del artista. */
var AL={'soledad 30 años (parte 1)':'soledad','soledad 30 años (parte 2)':'soledad'};
function key(n){var k=n.toLowerCase().trim();return AL[k]||k}
var $=function(i){return document.getElementById(i)};
var S={day:'sab',stage:'all',fav:{},alerts:false,favonly:false,done:{}};
try{var sv=JSON.parse(localStorage.getItem('rf26')||'{}');for(var k in sv)S[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem('rf26',JSON.stringify({fav:S.fav,alerts:S.alerts,favonly:S.favonly,done:S.done}))}catch(e){}}
function ts(date,hm,afterStart){var p=hm.split(':'),d=new Date(date+'T'+hm+':00-03:00');if(+p[0]<6)d=new Date(d.getTime()+864e5);return d.getTime()}
DAYS.forEach(function(d){d.s=d.s.map(function(r,i){var st=ts(d.date,r[1]),en=r[2]?ts(d.date,r[2]):st+30*60000;if(en<=st)en+=864e5;return{id:d.id+i,stage:r[0],h:r[1],e:r[2],name:r[3],st:st,en:en,pen:r[3]===PEN}}).sort(function(a,b){return a.st-b.st})});
function curDay(){return DAYS.filter(function(d){return d.id===S.day})[0]}
function bioFor(name){return name.split(/ \/ | \+ | - /).map(function(s){return s.trim()}).filter(function(s){return B[key(s)]||L[key(s)]}).map(function(s){return{n:s,b:B[key(s)]||''}})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
  $('tabs').innerHTML=DAYS.map(function(d){return '<button class="tab'+(d.id===S.day?' on':'')+'" data-day="'+d.id+'">'+d.lab+'</button>'}).join('');
  var ch=[['all','Todos','--acc']].concat(['m','p','a','u'].map(function(k){return[k,ST[k][0],ST[k][1]]}));
  $('chips').innerHTML=ch.map(function(c){return '<button class="chip'+(S.stage===c[0]?' on':'')+'" style="'+(S.stage===c[0]?'background:var('+c[2]+')':'')+'" data-stage="'+c[0]+'">'+c[1]+'</button>'}).join('');
  var now=Date.now(),L=curDay().s.filter(function(s){return S.stage==='all'||s.stage===S.stage||(s.stage==='x'&&S.stage==='all')});
  $('list').innerHTML=L.map(function(s){var live=now>=s.st&&now<s.en,past=now>=s.en,c=ST[s.stage][1];
    return '<div class="show'+(live?' now':'')+(past?' past':'')+'" style="--c:var('+c+')"><div class="t">'+s.h+'<small>'+(s.e?s.e:'')+'</small></div><div style="flex:1"><button class="nm" data-id="'+s.id+'">'+esc(s.name)+'</button><div class="st">'+ST[s.stage][0]+(live?'<span class="badge">EN VIVO</span>':'')+'</div></div>'+(s.pen?'':'<button class="star'+(S.fav[s.id]?' on':'')+'" data-fav="'+s.id+'" aria-label="Favorito">'+(S.fav[s.id]?'★':'☆')+'</button>')+'</div>'}).join('')+'<div class="note">Horarios publicados por la organización; pueden cambiar. Hora de Argentina.</div>';
}
function findShow(id){var r;DAYS.forEach(function(d){d.s.forEach(function(s){if(s.id===id)r=s})});return r}
function openSheet(id){var s=findShow(id),bs=s.pen?[]:bioFor(s.name),html='<button class="x" id="cl">✕</button><h2>'+esc(s.name)+'</h2><div class="meta">'+ST[s.stage][0]+' · '+s.h+(s.e?' a '+s.e:'')+'</div>';
  if(s.pen)html+='<p>Espacio abierto en La Pulpeña con peña, clases de danza y el Campeonato de Truco de la República durante toda la tarde.</p>';
  else if(bs.length)html+=bs.map(function(x){return (bs.length>1?'<p><b>'+esc(x.n)+'</b></p>':'')+(x.b?'<p>'+esc(x.b)+'</p>':'')+socFor(x.n)}).join('');
  else html+='<p>Todavía no tenemos un resumen cargado para este artista.</p>';
  if(!s.pen)html+='<a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(s.name.split(/ \/ | \+ | - /)[0]+' folklore biografía')+'">Buscar más sobre su carrera →</a>';
  $('sin').innerHTML=html;$('sheet').style.display='flex'}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function alertMsg(txt){var b=$('banner');b.textContent='🔔 '+txt;b.style.display='block';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();
  try{if('Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker)navigator.serviceWorker.ready.then(function(r){r.showNotification('República Folklore',{body:txt,icon:'icon-192.png'})});else new Notification('República Folklore',{body:txt})}}catch(e){}
  setTimeout(function(){b.style.display='none'},20000)}
function check(){
  if(!S.alerts)return;var now=Date.now(),g={};
  DAYS.forEach(function(d){d.s.forEach(function(s){var dt=s.st-now;if(s.pen||dt<=0||dt>10*60000||S.done[s.id])return;if(S.favonly&&!S.fav[s.id])return;S.done[s.id]=1;(g[s.h]=g[s.h]||[]).push(ST[s.stage][0]+': '+s.name)})});
  Object.keys(g).forEach(function(h){alertMsg('En 10 min ('+h+') → '+g[h].join(' · '))});
  if(Object.keys(g).length){save();render()}
}
document.addEventListener('click',function(e){var t=e.target;
  if(t.dataset.day){S.day=t.dataset.day;render()}
  else if(t.dataset.stage){S.stage=t.dataset.stage;render()}
  else if(t.dataset.fav){S.fav[t.dataset.fav]=!S.fav[t.dataset.fav];save();render()}
  else if(t.dataset.id)openSheet(t.dataset.id);
  else if(t.id==='cl'||t.id==='sheet')$('sheet').style.display='none'});
$('alerts').checked=S.alerts;$('favonly').checked=S.favonly;
$('alerts').onchange=function(){S.alerts=this.checked;save();
  if(S.alerts){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}check()}};
$('favonly').onchange=function(){S.favonly=this.checked;save()};
$('test').onclick=function(){alertMsg('Prueba: en 10 min → Macro: Abel Pintos · Personal: Cazzu')};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();check();setInterval(function(){check();render()},30000);
